# Runs FiltersAgent (https://github.com/AdguardTeam/FiltersAgent) on every new issue, and on an
# issue a maintainer adds the `filters-agent` label to. The agent reproduces the report in a browser
# with AdGuard Browser Extension or AdGuard CLI, checks a candidate rule and posts its report as an
# issue comment. It commits nothing.
name: filters-agent

on:
  # `opened` covers every new issue, `labeled` is a maintainer's manual trigger. GitHub cannot
  # filter `labeled` by label name, so the job checks it.
  issues:
    types:
      - opened
      - labeled

# The report comment posts from the workflow token. `contents: write` lets the run commit the before
# and after screenshots of a verified rule to the `filters-agent-screenshots` branch, which the
# comment shows them from.
permissions:
  contents: write
  issues: write

jobs:
  analyze:
    if: ${{ github.event.action == 'opened' || github.event.label.name == 'filters-agent' }}
    # An issue opened with the label, or labeled while its run is going, starts a second run. It
    # waits for the first one instead of investigating the issue in parallel.
    concurrency:
      group: filters-agent-${{ github.event.issue.number }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # Keeps the token out of .git/config in the workspace the agent works in.
          persist-credentials: false

      # AdGuard CLI for reports from desktop and mobile apps, plus the activated CLI home seeded by
      # filters-agent-seed-cli-home.yml.
      - name: Install the AdGuard CLI module
        id: adguard-cli
        uses: AdguardTeam/FiltersAgent/adguard-cli@v1

      - name: Analyze the issue
        id: agent
        uses: AdguardTeam/FiltersAgent@v1
        env:
          ADGUARD_LICENSE_KEY: ${{ secrets.ADGUARD_LICENSE_KEY }}
        with:
          githubToken: ${{ github.token }}
          llmBaseUrl: ${{ secrets.FILTERS_AGENT_LLM_BASE_URL }}
          llmApiKey: ${{ secrets.FILTERS_AGENT_LLM_API_KEY }}
          # Reads the screenshots too: the workflow sets no separate vision model.
          llmModel: deepseek-flash
          llmContextWindowTokens: '1048576'
          # A cap well above the heaviest real turn (~18k tokens with reasoning): a model that loops
          # stops in minutes instead of running until the gateway cuts the stream.
          llmMaxOutputTokens: '65536'
          llmRequestMaxAttempts: '3'
          blockerModules: ${{ steps.adguard-cli.outputs.manifest }}
          executors: browser_extension,adguard_cli
          # The label is a maintainer's request: report even when a maintainer is already on the
          # issue, and post a notice when the run fails. A run on a new issue stays silent in both
          # cases.
          force: ${{ github.event.action == 'labeled' }}
          excludedLabels: NSFW
          inProgressLabels: 'A: In progress'
          reportBots: adguard-bot
          issueNumber: ${{ github.event.issue.number }}

      - name: Upload run artifacts
        if: ${{ !cancelled() && steps.agent.outputs.artifacts-dir != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: filters-agent-artifacts-${{ github.run_number }}
          path: ${{ steps.agent.outputs.artifacts-dir }}
